<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" height="200">
  <defs>
    <!-- Cyan glow filter for nodes -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Stronger glow for key nodes -->
    <filter id="glow-strong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Gradient for traces -->
    <linearGradient id="trace-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <!-- Subtle grid dot pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="#1e3a5f" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="720" height="200" rx="12" fill="#0f172a"/>

  <!-- Dot grid background -->
  <rect width="720" height="200" rx="12" fill="url(#grid)"/>

  <!-- ══════════════════════════════════════════════ -->
  <!-- Letter traces — K A T A                       -->
  <!-- Built as PCB-style paths on the grid           -->
  <!-- Grid unit: 20px. Letters ~80px wide, 80px tall -->
  <!-- Y baseline: 60 to 140. X starts at 120.       -->
  <!-- ══════════════════════════════════════════════ -->

  <g stroke="url(#trace-grad)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">

    <!-- K — vertical + two diagonals -->
    <path d="M 140,60 L 140,140"/>
    <path d="M 140,100 L 170,60"/>
    <path d="M 140,100 L 170,140"/>

    <!-- A — two diagonals + crossbar -->
    <path d="M 240,140 L 260,60 L 280,140"/>
    <path d="M 248,110 L 272,110"/>

    <!-- T — horizontal top + vertical center -->
    <path d="M 340,60 L 400,60"/>
    <path d="M 370,60 L 370,140"/>

    <!-- A — two diagonals + crossbar -->
    <path d="M 460,140 L 480,60 L 500,140"/>
    <path d="M 468,110 L 492,110"/>
  </g>

  <!-- ══════════════════════════════════════════════ -->
  <!-- Junction nodes — glowing dots at intersections -->
  <!-- ══════════════════════════════════════════════ -->

  <g filter="url(#glow)">
    <!-- K nodes -->
    <circle cx="140" cy="60" r="3.5" fill="#22d3ee"/>
    <circle cx="140" cy="100" r="4" fill="#67e8f9"/>
    <circle cx="140" cy="140" r="3.5" fill="#22d3ee"/>
    <circle cx="170" cy="60" r="3" fill="#22d3ee"/>
    <circle cx="170" cy="140" r="3" fill="#22d3ee"/>

    <!-- A1 nodes -->
    <circle cx="240" cy="140" r="3" fill="#38bdf8"/>
    <circle cx="260" cy="60" r="4" fill="#67e8f9"/>
    <circle cx="280" cy="140" r="3" fill="#38bdf8"/>
    <circle cx="248" cy="110" r="2.5" fill="#67e8f9"/>
    <circle cx="272" cy="110" r="2.5" fill="#67e8f9"/>

    <!-- T nodes -->
    <circle cx="340" cy="60" r="3" fill="#818cf8"/>
    <circle cx="400" cy="60" r="3" fill="#818cf8"/>
    <circle cx="370" cy="60" r="4" fill="#a78bfa"/>
    <circle cx="370" cy="140" r="3.5" fill="#a78bfa"/>

    <!-- A2 nodes -->
    <circle cx="460" cy="140" r="3" fill="#a78bfa"/>
    <circle cx="480" cy="60" r="4" fill="#c4b5fd"/>
    <circle cx="500" cy="140" r="3" fill="#a78bfa"/>
    <circle cx="468" cy="110" r="2.5" fill="#a78bfa"/>
    <circle cx="492" cy="110" r="2.5" fill="#a78bfa"/>
  </g>

  <!-- ══════════════════════════════════════════════ -->
  <!-- Decorative circuit traces — ambient wiring     -->
  <!-- ══════════════════════════════════════════════ -->

  <g stroke="#1e3a5f" stroke-width="1.5" fill="none" opacity="0.5" stroke-linecap="round">
    <!-- Left ambient traces -->
    <path d="M 40,100 L 80,100 L 80,60 L 120,60"/>
    <path d="M 60,140 L 100,140 L 120,140"/>
    <path d="M 40,80 L 60,80 L 60,120 L 40,120"/>

    <!-- Between K and A -->
    <path d="M 170,100 L 200,100 L 220,100"/>
    <path d="M 190,80 L 190,120"/>

    <!-- Between A and T -->
    <path d="M 280,100 L 310,100 L 320,80"/>
    <path d="M 300,120 L 300,80"/>

    <!-- Between T and A -->
    <path d="M 400,100 L 430,100 L 440,80"/>
    <path d="M 420,120 L 420,80"/>

    <!-- Right ambient traces -->
    <path d="M 500,100 L 540,100 L 560,60 L 600,60"/>
    <path d="M 520,80 L 560,80"/>
    <path d="M 540,120 L 580,120 L 600,100"/>
    <path d="M 620,80 L 660,80 L 660,120 L 680,120"/>
  </g>

  <!-- Small ambient dots on decorative traces -->
  <g fill="#1e3a5f" opacity="0.6">
    <circle cx="40" cy="100" r="2"/>
    <circle cx="80" cy="100" r="2"/>
    <circle cx="80" cy="60" r="2"/>
    <circle cx="60" cy="140" r="2"/>
    <circle cx="200" cy="100" r="1.5"/>
    <circle cx="310" cy="100" r="1.5"/>
    <circle cx="430" cy="100" r="1.5"/>
    <circle cx="540" cy="100" r="2"/>
    <circle cx="560" cy="60" r="2"/>
    <circle cx="600" cy="60" r="2"/>
    <circle cx="580" cy="120" r="2"/>
    <circle cx="660" cy="80" r="2"/>
    <circle cx="660" cy="120" r="2"/>
    <circle cx="680" cy="120" r="2"/>
  </g>

  <!-- ══════════════════════════════════════════════ -->
  <!-- Tagline                                        -->
  <!-- ══════════════════════════════════════════════ -->

  <text x="360" y="172" text-anchor="middle"
        font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', monospace"
        font-size="11" fill="#64748b" letter-spacing="4">
    WORKSPACE ORCHESTRATOR
  </text>

</svg>
