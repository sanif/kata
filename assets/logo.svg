<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="720" height="220">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-big" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="grad-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="grad-mix" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.7" fill="#1e3a5f" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="720" height="220" rx="14" fill="#0c1425"/>
  <rect width="720" height="220" rx="14" fill="url(#grid)"/>

  <!-- ══════════════════════════════════════════════════ -->
  <!-- K   A   T   A                                     -->
  <!--                                                    -->
  <!-- Layout: centered, ~460px total                     -->
  <!-- Start X=130, letter gap=30, Y: 35..145 (110 tall) -->
  <!-- Stroke: 3px, nodes: 5-7px radius with glow        -->
  <!-- ══════════════════════════════════════════════════ -->

  <!-- ── Letter traces ─────────────────────────────── -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">

    <!-- K — cyan tones -->
    <g stroke="#22d3ee" stroke-width="3">
      <line x1="135" y1="35" x2="135" y2="145"/>
      <line x1="135" y1="95" x2="190" y2="35"/>
      <line x1="135" y1="95" x2="190" y2="145"/>
    </g>

    <!-- A1 — cyan to mix -->
    <g stroke="#38bdf8" stroke-width="3">
      <line x1="230" y1="145" x2="262" y2="35"/>
      <line x1="262" y1="35" x2="294" y2="145"/>
      <line x1="242" y1="107" x2="282" y2="107"/>
    </g>

    <!-- T — violet tones, BOLD clear T shape -->
    <g stroke="#a78bfa" stroke-width="3">
      <!-- Wide horizontal top bar -->
      <line x1="328" y1="35" x2="408" y2="35"/>
      <!-- Strong center vertical -->
      <line x1="368" y1="35" x2="368" y2="145"/>
    </g>

    <!-- A2 — violet tones -->
    <g stroke="#a78bfa" stroke-width="3">
      <line x1="450" y1="145" x2="482" y2="35"/>
      <line x1="482" y1="35" x2="514" y2="145"/>
      <line x1="462" y1="107" x2="502" y2="107"/>
    </g>
  </g>

  <!-- ── Glowing nodes ─────────────────────────────── -->

  <!-- K nodes — cyan glow -->
  <g filter="url(#glow)">
    <circle cx="135" cy="35" r="5" fill="#22d3ee"/>
    <circle cx="135" cy="145" r="5" fill="#22d3ee"/>
    <circle cx="135" cy="95" r="6" fill="#67e8f9"/>
    <circle cx="190" cy="35" r="4.5" fill="#22d3ee"/>
    <circle cx="190" cy="145" r="4.5" fill="#22d3ee"/>
  </g>

  <!-- A1 nodes — sky-cyan glow -->
  <g filter="url(#glow)">
    <circle cx="230" cy="145" r="4.5" fill="#38bdf8"/>
    <circle cx="262" cy="35" r="6" fill="#67e8f9"/>
    <circle cx="294" cy="145" r="4.5" fill="#38bdf8"/>
    <circle cx="242" cy="107" r="3.5" fill="#67e8f9"/>
    <circle cx="282" cy="107" r="3.5" fill="#67e8f9"/>
  </g>

  <!-- T nodes — violet glow, PROMINENT -->
  <g filter="url(#glow-big)">
    <circle cx="328" cy="35" r="5.5" fill="#a78bfa"/>
    <circle cx="408" cy="35" r="5.5" fill="#a78bfa"/>
    <circle cx="368" cy="35" r="7" fill="#c4b5fd"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="368" cy="145" r="5" fill="#a78bfa"/>
    <circle cx="348" cy="35" r="3.5" fill="#a78bfa"/>
    <circle cx="388" cy="35" r="3.5" fill="#a78bfa"/>
  </g>

  <!-- A2 nodes — violet glow -->
  <g filter="url(#glow)">
    <circle cx="450" cy="145" r="4.5" fill="#a78bfa"/>
    <circle cx="482" cy="35" r="6" fill="#c4b5fd"/>
    <circle cx="514" cy="145" r="4.5" fill="#a78bfa"/>
    <circle cx="462" cy="107" r="3.5" fill="#a78bfa"/>
    <circle cx="502" cy="107" r="3.5" fill="#a78bfa"/>
  </g>

  <!-- ── Ambient circuit traces ────────────────────── -->
  <g stroke="#1a2d4a" stroke-width="1.5" fill="none" opacity="0.5" stroke-linecap="round">
    <!-- Left -->
    <path d="M 25,90 L 65,90 L 85,55 L 115,55"/>
    <path d="M 45,125 L 75,125 L 115,145"/>
    <path d="M 25,70 L 45,70 L 45,110 L 25,110"/>

    <!-- K→A gap -->
    <path d="M 190,90 L 212,90"/>
    <path d="M 200,75 L 200,115"/>

    <!-- A→T gap -->
    <path d="M 294,90 L 314,90"/>
    <path d="M 304,75 L 304,110"/>

    <!-- T→A gap -->
    <path d="M 408,90 L 432,90"/>
    <path d="M 420,75 L 420,110"/>

    <!-- Right -->
    <path d="M 514,90 L 545,90 L 565,55 L 605,55"/>
    <path d="M 535,70 L 570,70"/>
    <path d="M 545,125 L 585,125 L 605,100"/>
    <path d="M 635,70 L 665,70 L 665,110 L 695,110"/>
  </g>

  <!-- Ambient dots -->
  <g fill="#1a2d4a" opacity="0.45">
    <circle cx="25" cy="90" r="2"/><circle cx="65" cy="90" r="2"/>
    <circle cx="85" cy="55" r="2"/><circle cx="45" cy="125" r="2"/>
    <circle cx="212" cy="90" r="1.5"/><circle cx="314" cy="90" r="1.5"/>
    <circle cx="432" cy="90" r="1.5"/>
    <circle cx="545" cy="90" r="2"/><circle cx="565" cy="55" r="2"/>
    <circle cx="605" cy="55" r="2"/><circle cx="585" cy="125" r="2"/>
    <circle cx="665" cy="70" r="2"/><circle cx="665" cy="110" r="2"/>
    <circle cx="695" cy="110" r="2"/>
  </g>

  <!-- ── Tagline ───────────────────────────────────── -->
  <text x="360" y="190" text-anchor="middle"
        font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', monospace"
        font-size="11" fill="#475569" letter-spacing="5">
    WORKSPACE ORCHESTRATOR
  </text>

</svg>
