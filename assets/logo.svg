<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="720" height="220">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-strong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="trace-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="40%" stop-color="#67e8f9"/>
      <stop offset="70%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="#1e3a5f" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="720" height="220" rx="12" fill="#0f172a"/>
  <rect width="720" height="220" rx="12" fill="url(#grid)"/>

  <!-- ══════════════════════════════════════════════ -->
  <!-- K  A  T  A — PCB trace letterforms            -->
  <!-- Each letter: ~90px wide, 100px tall            -->
  <!-- Total: 4*90 + 3*30(gaps) = 450px              -->
  <!-- Centered: (720-450)/2 = 135 start              -->
  <!-- Y: 40 to 140                                   -->
  <!-- ══════════════════════════════════════════════ -->

  <g stroke="url(#trace-grad)" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">

    <!-- K — left vertical + angled fork -->
    <path d="M 135,40 L 135,140"/>
    <path d="M 135,90 L 185,40"/>
    <path d="M 135,90 L 185,140"/>
    <!-- K horizontal connector at junction -->
    <path d="M 135,90 L 145,90"/>

    <!-- A — triangle + crossbar -->
    <path d="M 225,140 L 255,40 L 285,140"/>
    <path d="M 237,105 L 273,105"/>

    <!-- T — full width top bar + center vertical -->
    <path d="M 325,40 L 405,40"/>
    <path d="M 365,40 L 365,140"/>
    <!-- T serif brackets for visibility -->
    <path d="M 325,40 L 325,52"/>
    <path d="M 405,40 L 405,52"/>
    <path d="M 358,140 L 372,140"/>

    <!-- A — triangle + crossbar -->
    <path d="M 445,140 L 475,40 L 505,140"/>
    <path d="M 457,105 L 493,105"/>
  </g>

  <!-- ══════════════════════════════════════════════ -->
  <!-- Junction nodes — glowing dots at key points   -->
  <!-- ══════════════════════════════════════════════ -->

  <g filter="url(#glow)">
    <!-- K nodes -->
    <circle cx="135" cy="40" r="4" fill="#22d3ee"/>
    <circle cx="135" cy="90" r="5" fill="#67e8f9"/>
    <circle cx="135" cy="140" r="4" fill="#22d3ee"/>
    <circle cx="185" cy="40" r="3.5" fill="#22d3ee"/>
    <circle cx="185" cy="140" r="3.5" fill="#22d3ee"/>

    <!-- A1 nodes -->
    <circle cx="225" cy="140" r="3.5" fill="#38bdf8"/>
    <circle cx="255" cy="40" r="5" fill="#67e8f9"/>
    <circle cx="285" cy="140" r="3.5" fill="#38bdf8"/>
    <circle cx="237" cy="105" r="3" fill="#67e8f9"/>
    <circle cx="273" cy="105" r="3" fill="#67e8f9"/>

    <!-- T nodes -->
    <circle cx="325" cy="40" r="4" fill="#818cf8"/>
    <circle cx="365" cy="40" r="5" fill="#a78bfa"/>
    <circle cx="405" cy="40" r="4" fill="#818cf8"/>
    <circle cx="325" cy="52" r="3" fill="#818cf8"/>
    <circle cx="405" cy="52" r="3" fill="#818cf8"/>
    <circle cx="365" cy="140" r="4" fill="#a78bfa"/>
    <circle cx="358" cy="140" r="3" fill="#a78bfa"/>
    <circle cx="372" cy="140" r="3" fill="#a78bfa"/>

    <!-- A2 nodes -->
    <circle cx="445" cy="140" r="3.5" fill="#a78bfa"/>
    <circle cx="475" cy="40" r="5" fill="#c4b5fd"/>
    <circle cx="505" cy="140" r="3.5" fill="#a78bfa"/>
    <circle cx="457" cy="105" r="3" fill="#a78bfa"/>
    <circle cx="493" cy="105" r="3" fill="#a78bfa"/>
  </g>

  <!-- ══════════════════════════════════════════════ -->
  <!-- Ambient circuit traces — decorative wiring     -->
  <!-- ══════════════════════════════════════════════ -->

  <g stroke="#1e3a5f" stroke-width="1.5" fill="none" opacity="0.45" stroke-linecap="round">
    <!-- Left side -->
    <path d="M 30,90 L 70,90 L 90,60 L 115,60"/>
    <path d="M 50,120 L 80,120 L 115,140"/>
    <path d="M 30,70 L 50,70 L 50,110 L 30,110"/>

    <!-- K to A connector -->
    <path d="M 185,90 L 210,90 L 225,75"/>
    <path d="M 195,70 L 195,110"/>

    <!-- A to T connector -->
    <path d="M 285,90 L 305,90 L 315,70"/>
    <path d="M 295,110 L 295,70"/>

    <!-- T to A connector -->
    <path d="M 405,90 L 425,90 L 435,70"/>
    <path d="M 415,110 L 415,70"/>

    <!-- Right side -->
    <path d="M 505,90 L 540,90 L 560,60 L 600,60"/>
    <path d="M 525,70 L 560,70"/>
    <path d="M 540,120 L 580,120 L 600,100"/>
    <path d="M 630,70 L 660,70 L 660,110 L 690,110"/>
  </g>

  <!-- Ambient junction dots -->
  <g fill="#1e3a5f" opacity="0.5">
    <circle cx="30" cy="90" r="2"/>
    <circle cx="70" cy="90" r="2"/>
    <circle cx="90" cy="60" r="2"/>
    <circle cx="50" cy="120" r="2"/>
    <circle cx="210" cy="90" r="1.5"/>
    <circle cx="305" cy="90" r="1.5"/>
    <circle cx="425" cy="90" r="1.5"/>
    <circle cx="540" cy="90" r="2"/>
    <circle cx="560" cy="60" r="2"/>
    <circle cx="600" cy="60" r="2"/>
    <circle cx="580" cy="120" r="2"/>
    <circle cx="660" cy="70" r="2"/>
    <circle cx="660" cy="110" r="2"/>
    <circle cx="690" cy="110" r="2"/>
  </g>

  <!-- ══════════════════════════════════════════════ -->
  <!-- Tagline                                        -->
  <!-- ══════════════════════════════════════════════ -->

  <text x="360" y="185" text-anchor="middle"
        font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', monospace"
        font-size="11" fill="#64748b" letter-spacing="4">
    WORKSPACE ORCHESTRATOR
  </text>

</svg>
